<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment Cancelled</title>
    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f6f8fa;
            margin: 0;
            padding: 40px 16px;
        }

        .card {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
            text-align: center;
        }

        .icon {
            font-size: 56px;
            line-height: 1;
        }

        h1 {
            font-size: 24px;
            margin: 16px 0 8px;
            color: #b42318;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">❌</div>
        <h1>Payment Cancelled</h1>
        <p>Your payment was cancelled and you have not been charged.</p>
        <p>The order is still waiting for payment - you can use the "Pay Now" link in your
            email again whenever you are ready.</p>
    </div>
</body>

</html>
