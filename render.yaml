# Render Blueprint - read by Render only, and only via New > Blueprint. Creating
# the service manually instead ignores this file entirely.
#
# PORT is deliberately absent: Render injects it and server.js already reads
# process.env.PORT. Overriding it here would fail the health check.
#
# sync:false means Render prompts for the value at Blueprint creation and never
# stores it here - required for the secrets, and used for the rest so no value is
# baked into the repo. Note Render only prompts on FIRST creation; later blueprint
# updates skip these, so fill them all in the first time.
services:
  - type: web
    name: stripe-payment-backend
    runtime: node
    plan: free
    branch: main
    # Region is immutable once the service exists - changing it later means
    # deleting and recreating the service (and its URL).
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Optional. server.js falls back to Render's injected RENDER_EXTERNAL_URL,
      # so leave this blank unless you are serving from a custom domain.
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BC_COMPANY
        sync: false
      - key: BC_ENVIRONMENT
        sync: false
      - key: TENANT_ID
        sync: false
