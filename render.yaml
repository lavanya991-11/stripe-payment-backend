# Render Blueprint. PORT is deliberately absent: Render injects it and server.js
# already reads process.env.PORT. Every var below is marked sync:false because the
# values are secrets - set them in the Render dashboard, never in this file.
services:
  - type: web
    name: stripe-payment-backend
    runtime: node
    plan: free
    branch: main
    # Region is immutable once the service exists - changing it later means
    # deleting and recreating the service (and its URL).
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Optional. server.js falls back to Render's injected RENDER_EXTERNAL_URL,
      # so leave this blank unless you are serving from a custom domain.
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BC_COMPANY
        sync: false
      - key: BC_ENVIRONMENT
        sync: false
      - key: TENANT_ID
        sync: false
